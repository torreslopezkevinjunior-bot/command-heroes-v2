name: Build Command Heroes V2

on:
  push:
    paths:
      - "command-heroes-v2-proyecto.zip"
      - ".github/workflows/build-command-heroes-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q command-heroes-v2-proyecto.zip -d "$RUNNER_TEMP/command-heroes-v2"
          project_dir="$(find "$RUNNER_TEMP/command-heroes-v2" -type f -name build.gradle -printf '%h\n' | head -n 1)"
          test -n "$project_dir" || { echo "::error::No se encontró build.gradle dentro del ZIP"; exit 1; }
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $project_dir"
          echo "=== build.gradle ==="
          sed -n '1,220p' "$project_dir/build.gradle"
          echo "=== Java ==="
          java -version

      - name: Compile mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Verify output JAR and external GeckoLib
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Se esperaba un único JAR principal, se encontraron ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          jar_file="${jars[0]}"
          echo "JAR generado: $jar_file"
          ls -lh "$jar_file"
          if jar tf "$jar_file" | grep -q '^com/geckolib/'; then
            echo "::error::El JAR incluye clases de GeckoLib, pero debe instalarse por separado"
            exit 1
          fi
          if ! jar tf "$jar_file" | grep -q '^META-INF/mods.toml$'; then
            echo "::error::El JAR no contiene META-INF/mods.toml"
            exit 1
          fi
          echo "Verificación correcta: contiene mods.toml y no incorpora clases com.geckolib."

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: command-heroes-v2-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
